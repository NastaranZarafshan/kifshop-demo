isplay:inline-flex;justify-content:center;align-items:center;gap:8px;transition:.2s}.btn-outline{background:transparent;color:var(--brown)}.hero-buttons{display:flex;gap:12px;margin-top:25px}.hero-photo{height:420px;position:relative;display:flex;align-items:center;justify-content:center}.hero-photo img{width:85%;height:90%;object-fit:cover;border-radius:190px 190px 7px 7px;box-shadow:25px 25px 0 #d2bdab}.hero-label{position:absolute;bottom:32px;right:0;background:#fff;padding:17px 24px;box-shadow:0 12px 45px #4932251c}.hero-label b{display:block;font-size:20px}.featurebar{background:#fff;border-bottom:1px solid var(--line)}.features{display:grid;grid-template-columns:repeat(4,1fr);padding-top:23px;padding-bottom:23px;gap:20px}.feature{display:flex;gap:12px;align-items:center}.feature b{display:block;font-size:13px}.feature span{font-size:11px;color:var(--muted)}.feature .symbol{font-size:25px;color:var(--brown2)}section{padding:65px 0}.sectop{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:27px}.subtitle{color:var(--brown2);font-weight:700;font-size:12px}.sectop h2,.pagehead h1{font-size:29px;margin:4px 0 0}.more{color:var(--brown);border-bottom:1px solid var(--brown);font-weight:600}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.cat{display:block;position:relative;height:285px;overflow:hidden;border-radius:7px;background:#ddd}.cat img{height:100%;width:100%;object-fit:cover;transition:.5s}.cat:hover img{transform:scale(1.05)}.cat strong{position:absolute;bottom:18px;right:18px;background:#ffffffea;padding:11px 19px;font-size:14px}.productgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:21px}.product{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;position:relative}.productimg{display:block;background:#eee5df;position:relative;height:260px;overflow:hidden}.productimg img{width:100%;height:100%;object-fit:cover;transition:.4s}.product:hover img{transform:scale(1.045)}.tag{position:absolute;top:13px;right:13px;padding:5px 10px;background:#fff;font-size:11px;color:var(--brown)}.heart{position:absolute;top:13px;left:13px;border:0;border-radius:50%;background:#fff;height:33px;width:33px;font-size:18px;color:var(--brown)}.productbody{padding:15px}.productbody small{color:var(--muted)}.productbody h3{font-size:14px;margin:7px 0 12px;min-height:25px}.price{color:var(--brown);font-weight:800}.old{color:#aaa;text-decoration:line-through;font-size:11px;margin-right:8px}.productbottom{display:flex;justify-content:space-between;align-items:center}.add{background:var(--soft);border:none;border-radius:4px;padding:7px 11px;color:var(--brown);font-weight:700}.banner{background:#3b281f;color:#fff}.bannergrid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px}.banner img{width:100%;height:345px;object-fit:cover;border-radius:5px}.banner h2{font-size:37px}.banner p{line-height:2.4;color:#d8c9bd}.banner .btn{background:#f4e6d2;color:#4d2d20;border-color:#f4e6d2}.newsletter{background:var(--soft);text-align:center}.newsletter p{color:var(--muted)}.newsletter form{margin:25px auto 0;display:flex;max-width:470px;gap:8px}.newsletter input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:5px}.footer{background:#2d211b;color:#eee0d4;padding:50px 0 20px}.footgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:35px}.footer .brand{color:#fff}.footer p{line-height:2.5;color:#c1aca0}.footer a{display:block;color:#ccb8ab;padding:5px 0}.footer h3{font-size:15px}.footbottom{border-top:1px solid #5a463a;margin-top:35px;padding-top:20px;color:#af9788;text-align:center;font-size:12px}.pagehead{background:#f0e8e0;padding:40px 0}.crumb{color:#968477;font-size:12px;margin-top:8px}.layout{display:grid;grid-template-columns:235px 1fr;gap:30px}.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px}.sidebar h3{margin-top:0}.sidebar a{display:block;padding:9px 0;color:#67584e;border-bottom:1px solid #f4eee9}.filterrow{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.filterrow select,.field,textarea{border:1px solid var(--line);border-radius:5px;padding:11px;background:#fff;color:var(--ink);width:100%}.filterrow select{max-width:190px}.details{display:grid;grid-template-columns:1fr 1fr;gap:45px}.detail-img{width:100%;height:510px;object-fit:cover;border-radius:8px;background:#eee}.detail-info h1{font-size:30px}.detail-info p{line-height:2.3;color:#7b6a5f}.detail-price{font-size:25px;color:var(--brown);font-weight:800}.swatches{display:flex;gap:9px;margin:10px 0 22px}.swatch{width:27px;height:27px;border-radius:50%;border:3px solid white;outline:1px solid #ccc}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;width:max-content;gap:20px;padding:5px}.qty button{border:0;background:var(--soft);padding:5px 12px}.detail-actions{display:flex;gap:10px;margin:20px 0}.tablewrap{overflow-x:auto}.carttable{width:100%;border-collapse:collapse;background:white}.carttable th,.carttable td{padding:15px;border-bottom:1px solid var(--line);text-align:right}.carttable img{width:65px;height:65px;object-fit:cover;border-radius:5px}.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:25px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.fields label{display:block;font-weight:600;font-size:12px}.fields input,.fields textarea,.fields select{margin-top:7px}.wide{grid-column:1/-1}.stack{display:grid;gap:14px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{padding:20px;border:1px solid var(--line);border-radius:7px;background:#fff}.stat b{font-size:23px;display:block;color:var(--brown)}.stat span{color:var(--muted)}.empty{text-align:center;padding:60px 15px;color:var(--muted)}.empty h3{color:var(--ink)}.notice{background:#fff5e5;border:1px solid #eddbbe;border-radius:5px;padding:13px 16px;color:#82623b;line-height:2}.toast{position:fixed;bottom:25px;left:25px;background: ,.pagehead h1{font-size:24px}section{padding:40px 0}.newsletter form{flex-direction:column}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.statgrid{grid-template-columns:repeat(2,1fr)}.actions{gap:4px}.iconbtn{min-width:34px;height:36px}.filterrow{align-items:stretch}}
</style></head><body><div id="app"></div><script>
const IMG=['images/bag-brown.webp','images/bag-quilt.webp','images/backpack-brown.webp','images/bag-black.webp','images/woman.webp','images/wallet.webp','images/backpack.webp','images/man.webp'];
const defaults=[['کیف دوشی چرم آوا','زنانه',2450000,IMG[0],'جدید'],['کیف دستی کلاسیک هلن','زنانه',3200000,IMG[1],'پرفروش'],['کوله پشتی چرمی آرمان','مردانه',2890000,IMG[2],''],['کیف شانه‌ای پریا','زنانه',1780000,IMG[3],'ویژه'],['کیف چرم طبیعی روژان','زنانه',3650000,IMG[4],''],['کیف پول چرم مهر','اکسسوری',780000,IMG[5],'پرفروش'],['کوله روزمره نیکان','کوله',2250000,IMG[6],''],['کیف مجلسی دالیا','مجلسی',1980000,IMG[7],'جدید']].map((p,i)=>({id:i+1,name:p[0],cat:p[1],price:p[2],img:p[3],badge:p[4],stock:12,desc:'طراحی ظریف با متریال باکیفیت، دوخت بادوام و جزئیات دقیق. مناسب استفاده روزمره و هدیه‌ای ماندگار.'}));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};let products=load('kif_products',defaults),cart=load('kif_cart',[]),wish=load('kif_wish',[]),orders=load('kif_orders',[]),users=load('kif_users',[]),logged=load('kif_logged',null);const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const money=n=>Number(n||0).toLocaleString('fa-IR')+' تومان';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(path,label)=>`<a href="#/${path}">${label}</a>`;const route=()=>decodeURIComponent(location.hash.replace(/^#\/?/,'')||'home');const idOf=()=>Number(route().split('/')[1]);const image=(p)=>esc((p.img||IMG[0]).startsWith('https://images.unsplash.com/')? IMG[(Number(p.id)-1+IMG.length)%IMG.length] : (p.img||IMG[0]));function notify(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.append(x);setTimeout(()=>x.remove(),2600)}function addCart(id){let x=cart.find(p=>p.id===id);if(x)x.qty++;else cart.push({id,qty:1});save('kif_cart',cart);render();notify('محصول به سبد خرید اضافه شد')}function toggleWish(id){wish=wish.includes(id)?wish.filter(x=>x!==id):[...wish,id];save('kif_wish',wish);render();notify('علاقه‌مندی‌ها به‌روز شد')}function removeCart(id){cart=cart.filter(x=>x.id!==id);save('kif_cart',cart);render()}function qty(id,d){let x=cart.find(y=>y.id===id);if(!x)return;x.qty=Math.max(1,x.qty+d);save('kif_cart',cart);render()}function productCard(p){return `<article class="product"><a class="productimg" href="#/product/${p.id}"><img loading="lazy" src="${image(p)}" alt="${esc(p.name)}">${p.badge?`<span class="tag">${esc(p.badge)}</span>`:''}</a><button class="heart" onclick="toggleWish(${p.id})" aria-label="علاقه‌مندی">${wish.includes(p.id)?'♥':'♡'}</button><div class="productbody"><small>${esc(p.cat)} | چرم باکیفیت</small><h3>${link('product/'+p.id,esc(p.name))}</h3><div class="productbottom"><span class="price">${money(p.price)}</span><button class="add" onclick="addCart(${p.id})">+ سبد</button></div></div></article>`}function cards(a){return a.length?`<div class="productgrid">${a.map(productCard).join('')}</div>`:empty('محصولی پیدا نشد','محصولات دیگر را مشاهده کنید')}function empty(t,s){return `<div class="empty"><div style="font-size:45px">◇</div><h3>${t}</h3><p>${s}</p>${link('shop','مشاهده فروشگاه')}</div>`}function header(){return `<div class="top">ارسال رایگان برای سفارش‌های بالای ۳ میلیون تومان ✦ تضمین کیفیت و اصالت کالا</div><header class="header"><div class="container nav"><a class="brand" href="#/home">کیف<span>شاپ</span><span style="font-size:10px;display:block;letter-spacing:3px;color:#a38472">KIF SHOP</span></a><nav id="links" class="links">${[['home','صفحه اصلی'],['shop','فروشگاه'],['women','کیف زنانه'],['men','کیف مردانه'],['backpacks','کوله پشتی'],['about','درباره ما'],['contact','تماس با ما']].map(([r,t])=>`<a class="${route()===r?'active':''}" href="#/${r}">${t}</a>`).join('')}</nav><div class="actions"><button class="iconbtn" onclick="go('search')" title="جستجو">⌕</button><button class="iconbtn" onclick="go('favorites')" title="علاقه‌مندی‌ها">♡</button><button class="iconbtn" onclick="go('account')" title="حساب کاربری">♙</button><button class="iconbtn" onclick="go('cart')" title="سبد خرید">♧ <span class="count">${cart.reduce((a,b)=>a+b.qty,0).toLocaleString('fa-IR')}</span></button><button class="iconbtn mobilebtn" onclick="document.getElementById('links').classList.toggle('show')">☰</button></div></div></header>`}function footer(){return `<footer class="footer"><div class="container"><div class="footgrid"><div><a href="#/home" class="brand">کیف<span>شاپ</span></a><p>انتخابی ماندگار برای علاقه‌مندان به سبک و اصالت چرم. کیفیت، ظرافت و تجربه خرید دلنشین، تعهد ما به شماست.</p></div><div><h3>دسترسی سریع</h3>${link('shop','فروشگاه')}${link('about','درباره ما')}${link('blog','مجله کیف شاپ')}${link('contact','تماس با ما')}</div><div><h3>خدمات مشتریان</h3>${link('faq','سو at" href="#/${c[0]}"><img loading="lazy" src="${c[2]}" alt="${c[1]}"><strong>${c[1]} ←</strong></a>`).join('')}</div></div></section><section style="padding-top:0"><div class="container"><div class="sectop"><div><span class="subtitle">BEST SELLERS</span><h2>محبوب‌ترین انتخاب‌ها</h2></div>${link('shop','<span class="more">همه محصولات ←</span>')}</div>${cards(products.slice(0,8))}</div></section><section class="banner"><div class="container bannergrid"><div><div class="eyebrow" style="color:#d4ac80">CRAFTED WITH LOVE</div><h2>یک کیف، هزار داستان</h2><p>چرم با گذشت زمان شخصیت می‌گیرد. ما کیف‌هایی انتخاب می‌کنیم که همراه شما در ساختن خاطرات زیبا باشند.</p>${link('about','<span class="btn">بیشتر درباره ما</span>')}</div><img src="images/hero.webp" alt="کیف کلاسیک چرمی"></div></section><section><div class="container"><div class="sectop"><div><span class="subtitle">NEW ARRIVALS</span><h2>تازه رسیده‌ها</h2></div>${link('shop','<span class="more">مشاهده همه ←</span>')}</div>${cards(products.slice().reverse().slice(0,4))}</div></section><section class="newsletter"><div class="container"><span class="subtitle">JOIN OUR CLUB</span><h2>از تازه‌ترین محصولات باخبر شوید</h2><p>خبرنامه کیف شاپ؛ جدیدترین مجموعه‌ها و پیشنهادهای اختصاصی.</p><form onsubmit="event.preventDefault();notify('عضویت در خبرنامه در نسخه دمو شبیه‌سازی شده است');this.reset()"><input type="email" required placeholder="آدرس ایمیل شما"><button class="btn">عضویت</button></form></div></section>`}function listing(cat){let t=({shop:'همه محصولات',women:'کیف زنانه',men:'کیف مردانه',backpacks:'کوله پشتی',accessories:'اکسسوری چرمی',evening:'کیف مجلسی',new:'محصولات جدید',sale:'پیشنهادهای ویژه'})[cat]||'محصولات';let f=cat==='shop'?products:products.filter(p=>({women:p.cat==='زنانه'||p.cat==='مجلسی',men:p.cat==='مردانه',backpacks:p.cat==='کوله',accessories:p.cat==='اکسسوری',evening:p.cat==='مجلسی',new:!!p.badge,sale:!!p.badge})[cat]);return pagehead(t)+`<section><div class="container layout"><aside class="panel sidebar"><h3>دس tring('fa-IR')}</b><span>تعداد محصولات</span></div><div class="stat"><b>${orders.length.toLocaleString('fa-IR')}</b><span>سفارش ثبت‌شده</span></div><div class="stat"><b>${users.length.toLocaleString('fa-IR')}</b><span>حساب نمایشی</span></div><div class="stat"><b>${money(orders.reduce((a,o)=>a+o.total,0))}</b><span>ارزش سفارش‌های آزمایشی</span></div></div><div class="panel" style="margin-top:20px"><h3>به پنل مدیریت کیف شاپ خوش آمدید</h3><p>در این نسخه می‌توانید محصولات را اضافه، ویرایش و حذف کنید و سفارش‌های آزمایشی را ببینید. داده‌ها فقط در همین مرورگر ذخیره می‌شوند و بین کاربران همگام نیستند.</p>${link('admin-add','<span class="btn">+ افزودن محصول جدید</span>')}</div>`}if(r==='admin-products'){body=`<div class="panel tablewrap"><table class="carttable"><tr><th>تصویر</th><th>عنوان</th><th>دسته</th><th>قیمت</th><th>عملیات</th></tr>${products.map(p=>`<tr><td><img src="${image(p)}" alt=""></td><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td>${money(p.price)}</td><td><button class="add" onclick="go('admin-edit/${p.id}')">ویرایش</button> <button class="add" onclick="deleteProduct(${p.id})">حذف</button></td></tr>`).join('')}</table></div>`}if(r==='admin-add'||r.startsWith('admin-edit')){let p=products.find(x=>x.id===idOf())||{};body=`<div class="panel"><h3>${p.id?'ویرایش محصول':'افزودن محصول جدید'}</h3><form class="fields" onsubmit="saveProduct(event,${p.id||0})"><label>نام محصول<input class="field" name="name" required value="${esc(p.name||'')}"></label><label>دسته‌بندی<select class="field" name="cat">${['زنانه','مردانه','کوله','اکسسوری','مجلسی'].map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></label><label>قیمت (تومان)<input class="field" name="price" type="number" min="0" required value="${p.price??''}"></label><label>موجودی<input class="field" name="stock" type="number" min="0" value="${p.stock??10}"></label><label class="wide">آدرس تصویر محصول<input class="field" name="img" type="url" placeholder="https://..." value="${esc(p.img||'')}"></label><label>برچسب محصول<input class="field" name="badge" value="${esc(p.badge||'')}"></label><label class="wide">توضیحات<textarea class="field" name="desc" rows="5">${esc(p.desc||'')}</textarea></label><div><button class="btn">ذخیره محصول</button></div></form></div>`}if(r==='admin-orders'){body=`<div class="panel tablewrap"><table class="carttable"><tr><th>سفارش</th><th>مشتری</th><th>مبلغ</th><th>وضعیت</th></tr>${orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}<br>${esc(o.phone)}</td><td>${money(o.total)}</td><td><select class="field" onchange="orderStatus(${o.id},this.value)">${['در انتظار بررسی','در حال آماده‌سازی','ارسال شده','تحویل داده شده'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>${orders.length?'':'هنوز سفارشی ثبت نشده است.'}</div>`}if(r==='admin-customers'){body=`<div class="panel"><h3>مشتریان نمایشی</h3>${users.length?users.map(u=>`<p>${esc(u.name)} — ${esc(u.phone)}</p>`).join(''):'هنوز حساب نمایشی ثبت نشده است.'}</div>`}return pagehead('پنل مدیریت محتوا')+`<section><div class="container"><div class="notice" style="margin-bottom:20px">پنل مدیریت <b>صرفاً برای نمایش امکانات</b> است؛ فاقد ورود امن و دیتابیس سروری است و اطلاعات در مرورگر جاری نگهداری می‌شود.</div>${adminNav()}${body}</div></section>`}function saveProduct(e,id){e.preventDefault();let f=new FormData(e.target),o={id:id||Date.now(),name:f.get('name'),cat:f.get('cat'),price:Number(f.get('price')),stock:Number(f.get('stock')),img:f.get('img')||IMG[0],badge:f.get('badge'),desc:f.get('desc')};products=id?products.map(p=>p.id===id?o:p):[o,...products];save('kif_products',products);go('admin-products');notify('محصول ذخیره شد')}function deleteProduct(id){if(!confirm('این محصول حذف شود؟'))return;products=products.filter(p=>p.id!==id);save('kif_products',products);render()}function orderStatus(id,v){orders=orders.map(o=>o.id===id?{...o,status:v}:o);save('kif_orders',orders);notify('وضعیت سفارش به‌روز شد')}function infoPage(r){let t={about:'درباره کیف شاپ',contact:'تماس با ما',faq:'سوالات متداول',shipping:'ارسال و تحویل',returns:'شرایط مرجوعی',privacy:'حریم خصوصی',blog:'مجله کیف شاپ',profile:'پروفایل من',search:'جستجوی محصولات',favorites:'علاقه‌مندی‌ها', 'order-success':'سفارش ثبت شد'}[r]||'کیف شاپ';let content='';if(r==='about')content=`<h2>کیف شاپ؛ همراه استایل شما</h2><p>ما با الهام از زیبایی اصیل چرم، مجموعه‌ای از کیف‌های روزمره و خاص را گردآوری کرده‌ایم. توجه به جزئیات، انتخاب هوشمندانه و تجربه خرید آسان، پایه‌های این فروشگاه هستند.</p><p>این صفحه و اطلاعات کسب‌وکار، محتوای نمونه برای نمایش به مشتری است و قابل ویرایش خواهد بود.</p>`;if(r==='contact')content=`<h2>با ما در تماس باشید</h2><p>برای سوال‌ها و پیشنهادها فرم زیر را تکمیل کنید.</p><form class="stack" onsubmit="event.preventDefault();notify('پیام در دمو شبیه‌سازی شد');this.reset()"><input class="field" required placeholder="نام شما"><input class="field" type="email" required placeholder="ایمیل"><textarea class="field" required rows="5" placeholder="پیام شما"></textarea><button class="btn">ارسال پیام آزمایشی</button></form>`;if(r==='faq')content=[['چطور سفارش ثبت کنم؟','محصول را انتخاب کرده، به سبد خرید اضافه کنید و اطلاعات گیرنده را وارد کنید.'],['زمان ارسال چقدر است؟','در سایت نهایی، زمان‌بندی بر اساس شهر و روش ارسال مشخص می‌شود.'],['آیا امکان مرجوعی وجود دارد؟','شرایط و مهلت مرجوعی در نسخه نهایی مطابق سیاست فروشگاه تعیین می‌شود.'],['چطور سفارش را پیگیری کنم؟','از بخش سفارش‌های من در حساب کاربری استفاده کنید.']].map(([q,a])=>`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`).join('');if(r==='shipping')content='<h2>ارسال مطمئن</h2><p>سفارش‌ها پس از بررسی و بسته‌بندی ارسال می‌شوند. روش‌ها، هزینه‌ها و زمان دقیق ارسال در نسخه عملیاتی تعیین خواهد شد.</p>';if(r==='returns')content='<h2>بازگشت کالا</h2><p>این صفحه به سیاست مرجوعی، شرایط سلامت کالا و مراحل درخواست بازگشت اختصاص دارد. متن نهایی باید طبق قوانین و سیاست واقعی کسب‌وکار تکمیل شود.</p>';if(r==='privacy')content='<h2>حریم خصوصی</h2><p>در نسخه دمو، داده‌های نمایشی حساب و سفارش داخل فضای ذخیره‌سازی همین مرورگر نگهداری می‌شود. این نسخه برای اطلاعات واقعی مشتریان یا پرداخت مناسب نیست.</p>';if(r==='blog')content=`<h2>راهنمای انتخاب کیف چرمی</h2><p>چطور کیف مناسب استایل خود را انتخاب کنیم؟ هنگام خرید کیف، به ابعاد، کاربرد، نوع بند و کیفیت دوخت توجه کنید.</p><h2>نگهداری از چرم</h2><p>کیف را دور از رطوبت شدید و نور مستقیم قرار دهید و برای نظافت از دستمال نرم استفاده کنید.</p>`;if(r==='profile')content=logged?`<h3>${esc(logged.name)}</h3><p>شماره تماس: ${esc(logged.phone)}</p>${link('orders','مشاهده سفارش‌های من')}`:`${link('account','برای ورود کلیک کنید')}`;if(r==='search')content=`<input class="field" placeholder="نام محصول را جستجو کنید..." oninput="document.getElementById('search-results').innerHTML=cards(products.filter(p=>p.name.includes(this.value.trim())))"><div id="search-results" style="margin-top:25px">${cards(products)}</div>`;if(r==='favorites')content=cards(products.filter(p=>wish.includes(p.id)));if(r==='order-success')content=`<div class="empty"><h2>✓ سفارش آزمایشی شما ثبت شد</h2><p>شماره سفارش: ${esc(route().split('/')[1]||'')}</p>${link('orders','مشاهده سفارش‌ها')}</div>`;return pagehead(t)+`<section><div class="container"><div class="panel" style="max-width:${r==='search'||r==='favorites'?'1200':'820'}px;margin:auto;line-height:2.4">${content}</div></div></section>`}function render(){let r=route().split('/')[0];let pages=['shop','women','men','backpacks','accessories','evening','new','sale'];let body=r==='home'?home():pages.includes(r)?listing(r):r==='product'?detail():r==='cart'?cartPage():r==='checkout'?checkout():r==='account'?account():r==='orders'?ordersPage():r.startsWith('admin')?admin():infoPage(r);document.getElementById('app').innerHTML=header()+`<main>${body}</main>`+footer();document.title=(r==='home'?'فروشگاه کیف چرم':document.querySelector('h1')?.innerText||'فروشگاه')+' | کیف شاپ';window.scrollTo({top:0,behavior:'instant'})}window.addEventListener('hashchange',render);render();
</script></body></html>
